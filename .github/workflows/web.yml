name: Deploy Slung Website

on:
  push:
    branches: [main]

jobs:
  publish_landing:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: build and push the image
        run: |
          docker login --username hey-ewan --password ${{ secrets.GITHUB_TOKEN }} ghcr.io
          docker build . --tag ghcr.io/slunghq/web/web:latest
          docker push ghcr.io/slunghq/web/web:latest
        working-directory: ./

      - name: Deploy to Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

    permissions:
      contents: read
      packages: write
